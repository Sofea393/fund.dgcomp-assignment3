<!--This is our main code for our interactive program for part 2 of the fund. digi comp assignment-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campusly — Timetable Setup</title>

  <style> 
:root {
  --ink: #0B1524;
  --ink-2: #101E36;
  --blue: #2456E5;
  --blue-soft: #E8EEFF;
  --paper: #F5F6F2;
  --card: #FFFFFF;
  --line: #E1E4DC;
  --muted: #5B6478;
  --green: #2FBE87;
  --green-soft: #E4F9EF;
  --red: #E5484D;
  --red-soft: #FDE8E8;
  --amber: #F5A623;
  --amber-soft: #FFF4DE;
  --radius: 14px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: var(--paper);
  color: #1A1F29;
}

button,
input,
select,
textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

h1, h2, h3 {
  letter-spacing: -0.02em;
}

.btn {
  border: none;
  border-radius: 9px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 14px;
}

.btn-primary {
  background: var(--blue);
  color: white;
}

.btn-primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-ghost {
  background: white;
  border: 1px solid var(--line);
  color: #1A1F29;
}

.btn-danger {
  background: var(--red-soft);
  color: var(--red);
  border: 1px solid #F3C4C5;
}

.btn-green {
  background: var(--green-soft);
  color: #116441;
  border: 1px solid #A9E7C8;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

.field input,
.field select,
.field textarea,
table input,
table select {
  width: 100%;
  padding: 9px 10px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: white;
  font-size: 13px;
}

.field textarea {
  min-height: 120px;
  resize: vertical;
}
.muted {
  color: var(--muted);
  font-size: 13px;
}

.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 20px;
  background: var(--blue-soft);
  color: var(--blue);
  margin-left: 6px;
}

.status {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  display: none;
}

.status.show {
  display: block;
}

.status.success {
  background: var(--green-soft);
  border: 1px solid #A9E7C8;
  color: #116441;
}

.status.error {
  background: var(--red-soft);
  border: 1px solid #F3C4C5;
  color: #9B1C20;
}

.status.info {
  background: var(--blue-soft);
  border: 1px solid #B8C7FF;
  color: #163B9C;
}

/* ONBOARDING */

.onboard-wrap {
  min-height: 100vh;
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.onboard-card {
  width: 100%;
  max-width: 1100px;
  background: var(--paper);
  border-radius: 20px;
  padding: 32px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.45);
}

.onboard-eyebrow {
  color: var(--blue);
  text-transform: uppercase;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
}

.onboard-title {
  font-size: 26px;
  margin-bottom: 6px;
}

.onboard-desc {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 22px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.import-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.import-tab {
  border: 1px solid var(--line);
  background: white;
  color: #1A1F29;
  border-radius: 9px;
  padding: 9px 13px;
  font-weight: 700;
  font-size: 13px;
}

.import-tab.active {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
}

.import-panel {
  display: none;
}

.import-panel.active {
  display: block;
}

.example-box {
  background: #FBFBF9;
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 12px;
  font-family: Consolas, monospace;
  font-size: 12px;
  color: #343A46;
  white-space: pre-wrap;
  margin-top: 10px;
}

.table-wrap {
  overflow-x: auto;
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.table-preview {
  width: 100%;
  border-collapse: collapse;
  min-width: 960px;
}

.table-preview th,
.table-preview td {
  border-bottom: 1px solid var(--line);
  padding: 9px;
  text-align: left;
  font-size: 13px;
  vertical-align: top;
}

.table-preview th {
  background: var(--ink);
  color: white;
}

.table-preview tr:last-child td {
  border-bottom: none;
}

/* MAIN APP */

#app {
  display: none;
  min-height: 100vh;
}

#app.active {
  display: flex;
}

.sidebar {
  width: 240px;
  background: var(--ink);
  color: white;
  min-height: 100vh;
  position: sticky;
  top: 0;
  padding: 18px 14px;
}

brand {
  padding: 8px 8px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  margin-bottom: 14px;
}

.brand-title {
  font-size: 20px;
  font-weight: 800;
}

.brand-sub {
  font-size: 12px;
  color: #9AA6C0;
  margin-top: 3px;
}


  </style>

</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>This is a simple paragraph of text on my new HTML page.</p>

</body>
</html>
