<!--This is our main code for our interactive program for part 2 of the fund. digi comp assignment-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campusly — Timetable Setup</title>

  <style> 
:root {
  --ink: #0B1524;
  --ink-2: #101E36;
  --blue: #2456E5;
  --blue-soft: #E8EEFF;
  --paper: #F5F6F2;
  --card: #FFFFFF;
  --line: #E1E4DC;
  --muted: #5B6478;
  --green: #2FBE87;
  --green-soft: #E4F9EF;
  --red: #E5484D;
  --red-soft: #FDE8E8;
  --amber: #F5A623;
  --amber-soft: #FFF4DE;
  --radius: 14px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: var(--paper);
  color: #1A1F29;
}

button,
input,
select,
textarea {
  font-family: inherit;
}

button {
  cursor: pointer;
}

h1, h2, h3 {
  letter-spacing: -0.02em;
}

.btn {
  border: none;
  border-radius: 9px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 14px;
}

.btn-primary {
  background: var(--blue);
  color: white;
}

.btn-primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-ghost {
  background: white;
  border: 1px solid var(--line);
  color: #1A1F29;
}

.btn-danger {
  background: var(--red-soft);
  color: var(--red);
  border: 1px solid #F3C4C5;
}

.btn-green {
  background: var(--green-soft);
  color: #116441;
  border: 1px solid #A9E7C8;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

.field input,
.field select,
.field textarea,
table input,
table select {
  width: 100%;
  padding: 9px 10px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  background: white;
  font-size: 13px;
}

.field textarea {
  min-height: 120px;
  resize: vertical;
}

  </style>

</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>This is a simple paragraph of text on my new HTML page.</p>
    
    <a href="https://www.w3schools.com">Visit W3Schools for tutorials</a>

</body>
</html>
